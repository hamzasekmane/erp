name: erp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose: ["5432"]

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./server/.env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp}
      PORT: 4000
      TRUST_PROXY: "true"
      TRUST_PROXY_HOPS: 1
      UPLOAD_DIR: /app/uploads
      MAIL_OUTBOX_DIR: /app/.data/mail
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads
      - mail:/app/.data/mail
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # URL publique de l'API vue par le navigateur (ou /api derrière un reverse proxy)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    stop_grace_period: 30s

volumes:
  db-data:
  uploads:
  mail:
