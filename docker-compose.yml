name: erp

services:
  db:
    # 13+ is required: search_normalize() (migration 0013) uses normalize(),
    # added in PostgreSQL 13, and it needs UTF8 server encoding.
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the API's login role on first start (see the script's header).
      # Without it the only available credential is the superuser, and RLS is
      # inert: every policy is satisfied because the owner bypasses it.
      - ./server/docker/db-init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ERP_APP_ROLE: ${ERP_APP_ROLE:-erp_app}
      ERP_APP_PASSWORD: ${ERP_APP_PASSWORD:?ERP_APP_PASSWORD is required (password of the API database role)}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose: ["5432"]

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The API also reads variables from the environment below. An optional
    # env_file keeps `docker compose up` working from a clean clone: copy
    # server/.env.production.example to server/.env.production to override.
    env_file:
      - path: ./server/.env.production
        required: false
    environment:
      NODE_ENV: production
      # The API connects as the NON-superuser role so RLS actually applies.
      DATABASE_URL: postgres://${ERP_APP_ROLE:-erp_app}:${ERP_APP_PASSWORD}@db:5432/${POSTGRES_DB:-erp}
      # Migrations (and the SECURITY DEFINER helpers they create) run as the
      # owner: the helpers must be owned by a privileged role to see through
      # FORCE RLS, while the API role must not have that privilege.
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp}
      PORT: 4000
      TRUST_PROXY: "true"
      TRUST_PROXY_HOPS: 1
      UPLOAD_DIR: /app/uploads
      MAIL_OUTBOX_DIR: /app/.data/mail
      # The API refuses to start in production without explicit CORS origins
      # (env.ts rejects "*" and an empty value). Compose previously passed
      # neither, so the container could only be started if the operator happened
      # to also set it in .env.production — the default path failed at boot.
      # The web app proxies /api same-origin, so the only origin needed is the
      # public URL users visit.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Trust the reverse proxy's X-Forwarded-* headers; without this the audit
      # log records the proxy's IP for every request.
      TRUST_PROXY: "true"
      TRUST_PROXY_HOPS: 1
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads
      - mail:/app/.data/mail
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # URL publique de l'API vue par le navigateur (ou /api derrière un reverse proxy)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        # Proxy same-origin /api -> conteneur api (recommandé derrière un reverse proxy)
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:4000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

volumes:
  db-data:
  uploads:
  mail:
